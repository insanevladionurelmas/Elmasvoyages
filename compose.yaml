services:
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8092}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://elmasvoyages.com}
      TRUST_PROXY: "1"
    volumes:
      - inquiries:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  inquiries:
